# Python Workflow Update Changelog And Readme For Release

## Action

Follow the update-changelog-and-readme-for-release workflow:
1. Edit CHANGELOG.md with release notes or version changes
2. Edit README.md to update compatibility matrix or maintenance status
3. Commit both files together
4. Merge via pull request

